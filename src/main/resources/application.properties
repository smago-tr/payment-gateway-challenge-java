server.port=8090
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.mapper.allow-coercion-of-scalars=false

bank.url=http://localhost:8080
bank.connect-timeout=2s
bank.read-timeout=3s
bank.retry-backoff=200ms

management.endpoints.web.exposure.include=health,metrics,prometheus

# Dummy credential for the exercise; real deployments would load keys from a secrets store
gateway.api-key=test-merchant-key
